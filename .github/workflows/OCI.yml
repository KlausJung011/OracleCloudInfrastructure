name: Test OCI Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-oci:
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install oci-cli
          echo "$RUNNER_TEMP/oci-cli/bin" >> "$GITHUB_PATH"

      - name: Configure OCI credentials
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_KEY_FILE }}
        run: |
          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_USER"
            printf 'tenancy=%s\n' "$OCI_TENANCY"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'region=%s\n' "$OCI_REGION"
            printf 'key_file=%s/.oci/key.pem\n' "$HOME"
          } > "$HOME/.oci/config"

      - name: Test OCI authentication
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          oci iam availability-domain list \
            --compartment-id "$OCI_TENANCY"

      - name: Remove credentials
        if: always()
        run: |
          rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config"

name: OCI Terraform Plan

on:
  workflow_dispatch:
    inputs:
      ssh_cidr:
        description: 'Tu IPv4 publica seguida de /32 (ejemplo: 198.51.100.10/32)'
        required: true
        type: string

permissions:
  contents: read

# El backend HTTP con PAR no tiene bloqueo; usar este mismo grupo
# para TODOS los workflows que accedan a este estado.
concurrency:
  group: oci-terraform-lab-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: Terraform
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_HTTP_ADDRESS: ${{ secrets.TF_HTTP_ADDRESS }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidr: ${{ inputs.ssh_cidr }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Configure OCI credentials
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_KEY_FILE }}
        run: |
          test "$OCI_REGION" = "sa-saopaulo-1" || { echo 'OCI_REGION debe ser sa-saopaulo-1'; exit 1; }
          test -n "$TF_HTTP_ADDRESS" || { echo 'Falta TF_HTTP_ADDRESS'; exit 1; }
          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/key.pem"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_USER"
            printf 'tenancy=%s\n' "$OCI_TENANCY"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'region=%s\n' "$OCI_REGION"
            printf 'key_file=%s/.oci/key.pem\n' "$HOME"
          } > "$HOME/.oci/config"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -no-color -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Remove credentials
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -f "$HOME/.oci/key.pem" "$HOME/.oci/config"
